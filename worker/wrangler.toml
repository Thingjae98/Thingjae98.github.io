name = "family-agent"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://thingjae98.github.io"
GEMINI_MODEL = "gemini-3.8-flash"
VAPID_SUBJECT = "mailto:soavelajewelry@gmail.com"

# 서버를 DB(서울) 가까이에서 실행한다. 한국 접속이 미국(SJC)으로 잡혀 DB 조회마다 태평양을 오가던 문제
[placement]
mode = "targeted"
region = "aws:ap-northeast-2"

[[d1_databases]]
binding = "DB"
database_name = "family-agent"
database_id = "4c67c06f-7630-4bcc-86ba-54f3caab83e7"

[triggers]
crons = ["* * * * *"]

# secrets (npx wrangler secret put NAME): GEMINI_API_KEY, VAPID_PUBLIC, VAPID_PRIVATE_JWK, (선택) KRX_AUTH_KEY
